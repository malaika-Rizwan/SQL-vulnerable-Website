{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/">Home</a> / Login</nav>
<section class="auth-card card">
  <h1>Login</h1>
  <form method="post" class="stack-form">
    <label>Username<input name="username" required autocomplete="username" /></label>
    <label>Password<input name="password" type="password" required autocomplete="current-password" /></label>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
  <p class="muted">No account? <a href="{{ url_for('auth.register') }}">Register</a></p>
  <p class="warn">Default demo user after seed: <code>demo</code> / <code>demo123</code></p>
</section>
{% endblock %}
